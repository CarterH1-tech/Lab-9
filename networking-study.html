<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Networks Ch.1–5 Trainer</title>
<style>
  :root{
    --bg:#0f1420; --card:#1a2233; --card2:#222c42; --ink:#e8eefc; --mut:#9fb0d0;
    --acc:#5b8def; --acc2:#38d39f; --good:#2ecc71; --bad:#ff6b6b; --warn:#f5c451;
    --line:#2c3a56;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  header{padding:18px 20px 6px;max-width:1000px;margin:0 auto}
  h1{margin:0 0 2px;font-size:22px}
  header p{margin:0;color:var(--mut);font-size:13px}

  nav button{background:var(--card);color:var(--mut);border:1px solid var(--line);
    border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px}
  nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  main{max-width:1000px;margin:0 auto;padding:16px 20px 80px}

  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .drill{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;transition:.15s}
  .drill:hover{border-color:var(--acc);transform:translateY(-2px)}
  .drill b{display:block;margin-bottom:3px}
  .drill small{color:var(--mut)}
  .ch{display:inline-block;font-size:11px;background:#101a2e;border:1px solid var(--line);
    color:var(--mut);border-radius:6px;padding:1px 7px;margin-bottom:6px}
  h2{font-size:18px;margin:6px 0 4px}
  h3{font-size:15px;margin:16px 0 6px;color:var(--acc)}
  code,kbd{background:#0c1220;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:13px}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:7px 0;cursor:pointer;font-size:14px}
  .opt:hover{border-color:var(--acc)}
  .opt.ok{border-color:var(--good);background:#14301f}
  .opt.no{border-color:var(--bad);background:#33161a}
  input[type=number],input[type=text]{background:#0c1220;border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:8px 10px;font-size:15px;width:160px}
  input[type=checkbox]{width:18px;height:18px;vertical-align:-3px;margin-right:9px}
  button.act{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;margin:6px 8px 0 0}
  button.act.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
  button.act:disabled{opacity:.45;cursor:default}
  .sol{border-left:3px solid var(--acc2);background:#101a2e;border-radius:0 10px 10px 0;padding:10px 14px;margin-top:12px}

  .flag{font-weight:700}

    background:#0b101c;border:1px solid var(--line);border-radius:10px;padding:12px}
  .fc{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:26px 20px;min-height:160px;
    display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;cursor:pointer;user-select:none}
  .fc .a{color:var(--acc2);font-size:15px;text-align:left}

  svg.diagram{background:#0b101c;border:1px solid var(--line);border-radius:10px;max-width:100%}

  .stat{font-size:12px;color:var(--mut)}

<body>
<header>
  <h1>Networks Ch. 1–5 Trainer</h1>
  <p>Dordal, <i>An Introduction to Computer Networks</i> — drills, walkthroughs and flashcards built around the textbook exercises.</p>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<script>
/* ============================================================
   Tiny helpers
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const R = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt = (x,d=2)=>Number(x).toFixed(d);
const esc = s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ============================================================
   Generic graph helpers (for forwarding / spanning tree)
   ============================================================ */
function bfs(adj, src){
  const n=adj.length, dist=Array(n).fill(-1);
  dist[src]=0; const q=[src];
  for(let i=0;i<q.length;i++){ const v=q[i];
    for(const u of adj[v]) if(dist[u]<0){ dist[u]=dist[v]+1; q.push(u); } }
  return dist;
}
// parent of v = neighbour u with dist[u]=dist[v]-1 and smallest label
function parents(adj, labels, src){
  const dist=bfs(adj,src), par=Array(adj.length).fill(-1);
  for(let v=0;v<adj.length;v++){
    if(v===src||dist[v]<0) continue;
    let best=-1;
    for(const u of adj[v]) if(dist[u]===dist[v]-1){
      if(best<0 || labels[u]<labels[best]) best=u;
    }
    par[v]=best;
  }
  return {dist,par};
}
function svgGraph(nodes, edges, w=560, h=300){
  let s=`<svg class="diagram" viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">`;
  for(const [a,b] of edges){
    s+=`<line x1="${nodes[a].x}" y1="${nodes[a].y}" x2="${nodes[b].x}" y2="${nodes[b].y}" stroke="#3a4a6b" stroke-width="3"/>`;
  }
  for(const n of nodes){
    const r=n.r||16;
    s+=`<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${n.fill||'#22304d'}" stroke="${n.stroke||'#5b8def'}" stroke-width="2"/>`;
    s+=`<text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="11" fill="#e8eefc">${esc(n.label)}</text>`;
  }
  return s+'</svg>';
}

/* ============================================================
   DRILL GENERATORS
   ============================================================ */
const namePool  = ['S1','S2','S3','S4','S5','S6'];
const hostPool  = ['A','B','C','D','E','F','G','H'];

/* --- 1. Delay arithmetic (Ch1) --- */
function drillDelay(){
  const size=R(1,15)*100;                 // bytes
  const rate=pick([10,100,1000]);         // Mbps
  const dist=pick([500,1500,3000,5000]);  // km
  const hops=R(0,4);                      // store-and-forward routers
  const txMs = size*8/(rate*1e6)*1000;
  const propMs = dist/200;                // 200 km/ms
  const sfMs = hops*txMs;
  const total = txMs + sfMs + propMs;
  return { kind:'num', unit:'ms', ans:total, tol:0.05,
    title:'Packet delay',
    q:`A <b>${size}-byte</b> packet is sent at <b>${rate} Mbps</b> over a <b>${dist} km</b> path with
       <b>${hops}</b> store-and-forward routers (ignore queuing). How long until the <b>last bit</b> arrives, in ms?`,
    sol:`<b>Bandwidth (transmit) delay:</b> ${size} B × 8 / (${rate}×10⁶) = <code>${fmt(txMs,3)} ms</code> per link.<br>
         <b>Store-and-forward:</b> ${hops} router(s) × ${fmt(txMs,3)} ms = <code>${fmt(sfMs,3)} ms</code>.<br>
         <b>Propagation:</b> ${dist} km ÷ 200 km/ms = <code>${fmt(propMs,3)} ms</code>.<br>
         <b>Total = ${fmt(txMs,3)} + ${fmt(sfMs,3)} + ${fmt(propMs,3)} = <code>${fmt(total,3)} ms</code>.
         <br><span class="kbd">Queuing delay is ignored here (and is the only delay we can engineer away).</span>`
  };
}

/* --- 2. Longest-prefix match (Ch1) --- */
function ipToInt(str){
  const p=str.split('.').map(Number);
  return ((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3];
}
function prefixMatch(ip, cidr){
  const [a,plen]=cidr.split('/');
  const bits=+plen;
  const mask = bits===0 ? 0 : (bits===32 ? 0xffffffff : ((0xffffffff<<(32-bits))>>>0));
  return ((ipToInt(ip) & mask) >>> 0) === ((ipToInt(a) & mask) >>> 0);
}
function drillPrefix(){
  const nh=[{name:'R1'},{name:'R2'},{name:'R3'},{name:'R4'}];
  const table=[
    {net:'10.0.0.0/8',      hop:'R1'},
    {net:'10.1.0.0/16',     hop:'R2'},
    {net:'10.1.2.0/24',     hop:'R3'},
    {net:'10.1.2.128/25',   hop:'R4'},
    {net:'0.0.0.0/0',       hop:'ISP'}
  ];
  // random destination
  let oct=pick([ [10,0,R(1,254),R(1,254)],
                 [10,1,R(1,254),R(1,254)],
                 [10,1,2,R(1,254)],
                 [10,1,2,128+R(1,126)] ]);
  let ip=oct.join('.');
  const matches=table.filter(t=>prefixMatch(ip,t.net));
  matches.sort((a,b)=>+b.net.split('/')[1]-+a.net.split('/')[1]);
  const win=matches[0];
  const options=shuffle([...new Set(table.map(t=>t.hop))]).map(h=>({key:h,text:h}));
  const tbl=table.map(t=>`<tr><td><code>${t.net}</code></td><td>→ ${t.hop}</td></tr>`).join('');
  return { kind:'mc', title:'Longest-prefix match',
    q:`Router table:<br><code>${table.map(t=>t.net+' → '+t.hop).join('<br>')}</code><br><br>
       Which next hop is chosen for destination <b><code>${ip}</code></b>?`,
    options, ans:options.findIndex(o=>o.key===win.hop),
    sol:`Matching prefixes for <code>${ip}</code> (longest wins):<br>`+
        matches.map(m=>`• <code>${m.net}</code> → ${m.hop}`).join('<br>')+
        `<br><b>Longest = ${win.net} → ${win.hop}.</b><br>
         <span class="kbd">Longest prefix wins regardless of table order; a default /0 only applies if nothing else matches.</span>`
  };
}

/* --- 3. Forwarding next-hop on the diamond (Ch1/2) --- */
function buildDiamond(){
  const pos=[{x:90,y:150},{x:250,y:70},{x:250,y:230},{x:410,y:150}];
  const edgeIdx=[[0,1],[0,2],[1,3],[2,3]];
  const swLabels=shuffle(namePool).slice(0,4);
  const nodes=[], labels=[];
  for(let i=0;i<4;i++){ nodes.push({x:pos[i].x,y:pos[i].y,label:swLabels[i]}); labels.push(swLabels[i]); }
  // hosts: up to 2 per switch, placed on rings around the node
  const ring={0:[[30,90],[30,210]],1:[[250,20],[330,20]],2:[[250,280],[330,280]],3:[[470,90],[470,210]]};
  const adj=[[],[],[],[]];
  for(const [a,b] of edgeIdx){ adj[a].push(b); adj[b].push(a); }
  const hosts=[]; // {node index, label}
  const hostNames=shuffle(hostPool);
  let hi=0;
  for(let i=0;i<4;i++){
    const many=R(1,2);
    for(let j=0;j<many && hi<hostNames.length;j++){
      const [hx,hy]=ring[i][j];
      const lbl=hostNames[hi++];
      const idx=nodes.length;
      nodes.push({x:hx,y:hy,label:lbl,r:13,fill:'#12281f',stroke:'#38d39f'});
      labels.push(lbl);
      adj.push([i]); adj[i].push(idx);
      hosts.push({sw:i,label:lbl,node:idx});
    }
  }
  return {nodes,edgeIdx,adj,labels,swLabels,hosts};
}
function drillForward(){
  const g=buildDiamond();
  const sw=R(0,3);
  const destHost=pick(g.hosts);
  const {dist}=parents(g.adj,g.labels,sw);
  const d=dist[destHost.node];
  let ans;
  if(d===1 && destHost.sw===sw){ ans='direct'; }
  else {
    // FIRST hop from sw: a neighbour u with dist[u] === d-1, smallest label on a tie
    let best=-1;
    for(const u of g.adj[sw]) if(dist[u]===d-1){ if(best<0 || g.labels[u]<g.labels[best]) best=u; }
    ans = best<0 ? 'direct' : g.labels[best];
  }
  // options = every neighbour of sw + 'direct'
  const opts=[...new Set(g.adj[sw].map(i=>g.labels[i]))];
  if(!opts.includes('direct')) opts.push('direct');
  const options=shuffle(opts).map(o=>({key:o,text:o}));
  let sol=`Shortest path from <b>${g.labels[sw]}</b> to <b>${destHost.label}</b> is <b>${d} hop${d===1?'':'s'}</b>.`;
  if(ans==='direct') sol+=` <b>${destHost.label}</b> is attached to ${g.labels[sw]} → next hop is <b>local/direct</b>.`;
  else sol+=` So the first hop is the neighbour <b>${ans}</b>.`;
  sol+=`<br><span class="kbd">Only the FIRST step matters — the rest of the path is other switches' problem.</span>`;
  const ties = g.adj[sw].filter(u=>dist[u]===d-1).map(u=>g.labels[u]);
  if(ties.length>1 && ans!=='direct') sol+=`<br><span class="kbd">Tie between ${ties.join(', ')} → broke it by smallest label.</span>`;
  return { kind:'mc', title:`Next hop from ${g.labels[sw]}`,
    q:`<div class="row">${svgGraph(g.nodes, g.edgeIdx.map(([a,b])=>[a,b]).concat(g.hosts.map(h=>[h.sw,h.node])))}</div>
       A packet at switch <b>${g.labels[sw]}</b> is destined for host <b>${destHost.label}</b>.
       What is the <b>next hop</b>?`,
    options, ans:options.findIndex(o=>o.key===String(ans)), sol };
}

/* --- 4. Sliding window throughput (Ch1) --- */
function drillWindow(){
  const W=R(2,20), size=pick([500,1000,1500]), rtt=pick([10,20,50,100,200]);
  const mbps = W*size*8/(rtt*1e-3)/1e6;
  return { kind:'num', unit:'Mbps', ans:mbps, tol:0.06, title:'Sliding-window throughput',
    q:`A TCP connection keeps a window of <b>${W}</b> packets of <b>${size} bytes</b> in flight.
       The round-trip time is <b>${rtt} ms</b>. What is the maximum (no-loss) throughput in <b>Mbps</b>?`,
    sol:`One window is delivered per RTT.<br>
         Throughput = W × size × 8 / RTT = ${W} × ${size} × 8 / ${rtt}ms = <code>${fmt(mbps,2)} Mbps</code>.<br>
         <span class="kbd">The ideal window sends exactly one window per RTT — sliding windows hide store-and-forward and propagation delay.</span>`
  };
}

/* --- 5. Learning switch on a line (Ch2) --- */
function lineTopo(){
  const swLabels=shuffle(namePool).slice(0,3);
  const hostNames=shuffle(hostPool);
  const hosts=[]; let hi=0;
  const nodes=[{x:80,y:150,label:swLabels[0]},{x:280,y:150,label:swLabels[1]},{x:480,y:150,label:swLabels[2]}];
  const rings={0:[[40,90],[40,210]],1:[[280,40],[280,260]],2:[[520,90],[520,210]]};
  const nHost={};
  const nodeOf={}; // label -> node index (switch)
  const portOf={}; // switchLabel -> {nodeLabel: portName}
  const portNeighbor={};
  for(let i=0;i<3;i++){ portOf[swLabels[i]]={}; }
  let portCounter=1;
  function addPort(swIdx, otherLabel){
    const p='p'+(portCounter++);
    portOf[swLabels[swIdx]][otherLabel]=p;
    portNeighbor[p]={sw:swLabels[swIdx],other:otherLabel};
  }
  // host counts: ensure at least 1 each, maybe 2 at an end
  const counts=[R(1,2),R(1,2),R(1,2)];
  const hostList=[];
  for(let i=0;i<3;i++){
    const c=counts[i];
    for(let j=0;j<c && hi<hostNames.length;j++){
      const [hx,hy]=rings[i][j];
      const lbl=hostNames[hi++]; const idx=nodes.length;
      nodes.push({x:hx,y:hy,label:lbl,r:13,fill:'#12281f',stroke:'#38d39f'});
      addPort(i,lbl);
      hostList.push({sw:i,label:lbl,node:idx});
    }
  }
  // switch-switch ports
  addPort(0, swLabels[1]);
  addPort(1, swLabels[0]);
  addPort(1, swLabels[2]);
  addPort(2, swLabels[1]);
  const switchIds=new Set(swLabels);
  const switchOfHost={}; hostList.forEach(h=>switchOfHost[h.label]=swLabels[h.sw]);
  const edgePairs=[[0,1],[1,2]].concat(hostList.map(h=>[h.sw,h.node]));
  return {nodes,edgePairs,swLabels,hostList,switchOfHost,portOf,portNeighbor,switchIds,
          edges:[[0,1],[1,2]]};
}
function simLearning(topo, seq){
  const tables={}; topo.swLabels.forEach(s=>tables[s]={});
  const seen=[];
  for(const [src,dst] of seq){
    const pktSeen=new Set();
    const start=topo.switchOfHost[src];
    const startPort=topo.portOf[start][src];
    const queue=[[start,startPort]];
    const visited=new Set();
    while(queue.length){
      const [swIn,inPort]=queue.shift();
      if(visited.has(swIn)) continue;
      visited.add(swIn); pktSeen.add(swIn);
      tables[swIn][src]=inPort;                       // learn source
      if(tables[swIn][dst]!==undefined){
        const outPort=tables[swIn][dst];
        const nb=Object.keys(topo.portOf[swIn]).find(k=>topo.portOf[swIn][k]===outPort);
        if(topo.switchIds.has(nb) && outPort!==inPort){
          const arr=topo.portOf[nb][swIn];
          queue.push([nb,arr]);
        }
      } else {
        for(const [nb,port] of Object.entries(topo.portOf[swIn])){
          if(port===inPort) continue;
          if(topo.switchIds.has(nb)){
            const arr=topo.portOf[nb][swIn];
            queue.push([nb,arr]);
          }
        }
      }
    }
    seen.push(pktSeen);
  }
  return {tables,seen};
}
function drillLearning(){
  const topo=lineTopo();
  const hosts=shuffle(topo.hostList.map(h=>h.label));
  const a=pick(hosts);
  const b=pick(hosts.filter(x=>x!==a));
  const seq=[[a,b],[b,a]];
  let c=null;
  if(hosts.length>2 && Math.random()<0.65){
    c=pick(hosts.filter(x=>x!==a&&x!==b));
    seq.push([c,b]);
  }
  const k=seq.length-1;
  const [src,dst]=seq[k];
  const {tables,seen}=simLearning(topo,seq);
  const allSw=topo.swLabels;
  const options=shuffle(allSw).map(s=>({key:s,text:s}));
  const correct=new Set([...seen[k]]);
  const lines=allSw.map(s=>{
    const t=tables[s]; const keys=Object.keys(t);
    return `<b>${s}</b>: ${keys.length?keys.map(kk=>`${kk}→${t[kk]}`).join(', '):'(empty)'}`;
  }).join('<br>');
  const seqTxt=seq.map((p,i)=>`${i+1}. ${p[0]} → ${p[1]}${i===k?'  ← asked about this one':''}`).join('<br>');
  return { kind:'multi', title:`Learning switch: ${src} → ${dst}`,
    q:`<div class="row">${svgGraph(topo.nodes, topo.edgePairs, 560, 300)}</div>
       Every forwarding table starts <b>empty</b>. These transmissions happen in order (no other traffic):<br>
       <b>${seqTxt}</b><br><br>
       Which switches <b>see</b> the last packet, <b>${src} → ${dst}</b>?`,
    options, ans:options.map((o,i)=>correct.has(o.key)?i:null).filter(x=>x!==null),
    sol:`A switch <b>floods</b> when it doesn't know the destination, and <b>learns the source</b> from the port it arrived on.<br>
         Switches that saw <b>${src} → ${dst}</b>: <b>${[...correct].join(', ')}</b>.<br>
         Tables after all transmissions:<br>${lines}<br>
         <span class="kbd">Once a switch knows the destination it forwards precisely and stops the flood — that's why earlier
         transmissions change who sees the later ones.</span>`
  };
}

/* --- 6. Exponential backoff (Ch2) --- */
function simulateBackoff(n){
  const st=[]; for(let i=1;i<=n;i++) st.push({name:'S'+i,attempts:0,time:0});
  const log=[]; let t=0;
  for(let step=0; step<300; step++){
    const active=st.filter(s=>s.time===t);
    if(active.length===0){ t++; continue; }
    if(active.length===1){
      log.push({t,type:'win',who:active[0].name});
      return log;
    }
    log.push({t,type:'collide',who:active.map(s=>s.name)});
    active.forEach(s=>{
      s.attempts++;
      const max=Math.pow(2,Math.min(s.attempts,10));
      const k=R(0,max-1);
      log.push({t,type:'bo',who:s.name,attempt:s.attempts,k,next:t+1+k});
      s.time=t+1+k;
    });
    t++;
  }
  return log;
}
function timelineHtml(log){
  let out='';
  for(const e of log){
    if(e.type==='collide') out+=`<span style="color:#ff6b6b">t=${e.t}: ${e.who.join(', ')} transmit → COLLISION</span>\n`;
    else if(e.type==='bo') out+=`   ${e.who}: attempt #${e.attempt}, k=${e.k} → retry at t=${e.next}\n`;
    else out+=`<span style="color:#38d39f">t=${e.t}: only ${e.who} transmits → SUCCESS</span>\n`;
  }
  return out;
}
function drillBackoff(){
  const n=R(3,5);
  const log=simulateBackoff(n);
  return { kind:'reveal', title:'Exponential backoff',
    q:`<b>${n}</b> stations (S1…S${n}) all have a packet ready and all start transmitting at <b>t=0</b>.
       They detect the collision one slot later and use Ethernet's exponential backoff.
       Simulate the contention period until one station wins.`,
    sol:`<div class="timeline">${timelineHtml(log)}</div>
      <b>Reminder of the rule:</b> after attempt N (1≤N≤10), pick a random <code>k&lt;2ᴺ</code>;
      wait k slot times; give up after N=16.<br>
      <span class="kbd">Ethernet is 1-persistent, so several stations waiting for a quiet line always cause an
      initial collision — backoff then sorts out who wins.</span>`
  };
}

/* --- 7. Spanning tree (Ch3) --- */
function drillSpanning(){
  // diamond + an extra edge S1-S4 to create cycles
  const g=buildDiamond();
  const extra=[0,3];
  const adj=g.adj.map(a=>a.slice());
  adj[0].push(3); adj[3].push(0);
  const root=g.swLabels.indexOf([...g.swLabels].sort()[0]);
  const {dist,par}=parents(adj,g.labels,root);
  const enabled=new Set();
  for(let v=0;v<4;v++) if(v!==root && par[v]>=0){ enabled.add([Math.min(v,par[v]),Math.max(v,par[v])].join('-')); }
  const allEdges=[[0,1],[0,2],[1,3],[2,3],[0,3]];
  const pruned=allEdges.filter(([a,b])=>!enabled.has([Math.min(a,b),Math.max(a,b)].join('-')));
  const options=allEdges.map(([a,b])=>({key:a+'-'+b,text:g.swLabels[a]+' — '+g.swLabels[b]}));
  const correct=pruned.map(([a,b])=>options.findIndex(o=>o.key===Math.min(a,b)+'-'+Math.max(a,b)));
  const enabledList=enabled.size?[...enabled].map(e=>{const [a,b]=e.split('-').map(Number);return g.swLabels[a]+'—'+g.swLabels[b];}).join(', '):'(none)';
  return { kind:'multi', title:'Spanning-tree pruning',
    q:`<div class="row">${svgGraph(g.nodes, allEdges.concat(g.hosts.map(h=>[h.sw,h.node])))}</div>
       Fully switched network (no hubs). Switch IDs are the numbers in the names (e.g. <code>S3</code> = ID 3),
       so <b>${g.swLabels[root]}</b> is the root. Which links get <b>pruned</b> by the spanning-tree algorithm?
       <span class="kbd">(each station's link to the root plus links others use toward the root stays enabled)</span>`,
    options, ans:correct,
    sol:`Root = smallest ID = <b>${g.swLabels[root]}</b>. BFS from the root; each node's parent is the shortest-cost
         neighbour, ties broken by smallest ID.<br>
         <b>Kept:</b> ${enabledList}<br>
         <b>Pruned:</b> ${pruned.map(([a,b])=>g.swLabels[a]+'—'+g.swLabels[b]).join(', ')}<br>
         <span class="kbd">Disabled links sit idle even if shorter; all traffic ends up going toward/through the root.</span>`
  };
}

/* --- 8. Wi-Fi contention interval (Ch4) --- */
function drillContention(){
  const slots=pick([16,32,64,128]);
  const size=pick([512,1024,1500]);
  const rate=pick([11,54]);
  const slotUs=20;
  const contUs=slots*slotUs;
  const txUs=size*8/rate*1; // bytes*8/rate(Mbps) = us since Mbps=bits/us
  const loss=contUs/(contUs+txUs)*100;
  return { kind:'num', unit:'µs', ans:contUs, tol:0.02, title:'Wi-Fi contention cost',
    q:`A Wi-Fi (802.11g) sender's average contention interval is <b>${slots} slot times</b>
       (slot time = ${slotUs} µs). How long is the contention interval, in <b>µs</b>?`,
    sol:`${slots} slots × ${slotUs} µs/slot = <code>${contUs} µs</code>.<br>
         <span class="kbd">Useful check: a ${size} B packet at ${rate} Mbps takes ${fmt(txUs,1)} µs,
         so contention wastes about ${fmt(loss,1)}% of the time.</span>`
  };
}

/* --- 9. Ranging / guard interval (Ch4) --- */
function drillRanging(){
  const v=pick([10,20,33]);
  const T=pick([10,30,60]);
  const c=300; // m/us
  const moved=v*T;            // metres per update interval
  const errUs=moved/c;        // timing error one-way
  const guard=2*errUs;        // double (early or late)
  return { kind:'num', unit:'µs', ans:guard, tol:0.03, title:'Ranging / guard interval',
    q:`A wireless subscriber moves at <b>${v} m/s</b>. It updates its ranging measurement once every
       <b>${T} s</b>. How much <b>guard time</b> (µs) must be allowed per transmitted packet so that
       early/late arrivals never overlap? (Speed of light = 300 m/µs; double the one-way error.)`,
    sol:`Distance travelled per update = ${v} × ${T} = <b>${moved} m</b>.<br>
         One-way timing error = ${moved} / 300 = <code>${fmt(errUs,2)} µs</code>.<br>
         Guard time = 2 × that = <code>${fmt(guard,2)} µs</code> (the base station can't tell early from late).<br>
         <span class="kbd">WiMAX/LTE schedule uplink slots precisely so transmissions arrive back-to-back — that's why ranging matters.</span>`
  };
}

/* --- 10. Hidden node (Ch4) --- */
function drillHidden(){
  const scenario=pick(['line','wall']);
  const options=shuffle([
    {key:'C',text:'At C (the middle node) only'},
    {key:'A',text:'At A and B'},
    {key:'none',text:'Nowhere — no collision'},
    {key:'all',text:'At A, B and C'}
  ]);
  const ansKey='C';
  return { kind:'mc', title:'Hidden-node problem',
    q:`Nodes A and B are each within range of C, but A and B are <b>out of range of each other</b>
       (${scenario==='wall'?'a radio-opaque wall between them':'too far apart'}).
       A and B transmit <b>at the same time</b>. Where does a collision occur?`,
    options, ans:options.findIndex(o=>o.key===ansKey),
    sol:`C receives both signals and they interfere → <b>collision at C</b>.<br>
         Neither A nor B can detect it (they can't hear each other), so neither knows to back off.
         That is exactly what the <b>hidden-node problem</b> is, and why Wi-Fi adds link-layer ACKs and optionally RTS/CTS.
         <span class="kbd">A collision is local — it happens at the receiver, not in the whole network.</span>`
  };
}

/* --- 11. Token ring wait (Ch5) --- */
function drillToken(){
  const rate=pick([4,10,16]);
  const tk=pick([32,64,128]);
  const N=pick([10,20,40,100]);
  const avgPass=N/2;
  const waitMs=avgPass*(tk*8/(rate*1e6))*1000;
  return { kind:'num', unit:'ms', ans:waitMs, tol:0.05, title:'Token Ring average wait',
    q:`A ${rate} Mbps Token Ring has <b>${N}</b> equally-active stations and a <b>${tk}-byte</b> token.
       On average, how long (in <b>ms</b>) does a station wait to receive the token? Ignore propagation
       delay and the inter-packet gap.`,
    sol:`Average number of stations the token must pass = N/2 = ${avgPass}.<br>
         Time to pass one token = ${tk} B × 8 / (${rate}×10⁶) = <code>${fmt(tk*8/(rate*1e6)*1000,4)} ms</code>.<br>
         Wait = ${avgPass} × that = <code>${fmt(waitMs,3)} ms</code>.<br>
         <span class="kbd">Token Ring is collision-free and perfectly fair: N busy stations each get 1/N of the turns.</span>`
  };
}

/* --- 12. ATM cells (Ch5) --- */
function drillATM(){
  const P=pick([40,100,512,1500,4096]);
  const mode=pick(['AAL5','AAL3/4']);
  let cells, usefulPer;
  if(mode==='AAL5'){ cells=Math.ceil(P/48); usefulPer=48; }
  else { cells=Math.ceil((P+8)/44); usefulPer=44; }
  const overhead=1 - P/(cells*53);
  const q = Math.random()<0.5
    ? {ask:'cells', ans:cells, unit:'cells'}
    : {ask:'eff', ans:overhead*100, unit:'%', tol:0.5};
  const howM = mode==='AAL5'
    ? 'AAL5 chops the CS-PDU into <b>48-byte</b> chunks (5 B ATM header per cell).'
    : 'AAL3/4 wraps the CS-PDU (adds 8 B) and chops it into <b>44-byte</b> chunks — each cell then carries 4 B of AAL header/trailer plus the 5 B ATM header (9 B overhead per cell).';
  return { kind:'num', title:`ATM ${mode} packing`, unit:q.unit, ans:q.ans, tol:(q.ask==='cells'?0:0.5),
    q:`An IP packet of <b>${P} bytes</b> is carried over ATM using <b>${mode}</b>. ${howM}<br>
       ${q.ask==='cells' ? 'How many cells are needed?' : 'What percentage of the transmitted bytes is payload (round to ~0.1%)?'}`,
    sol:`Cells = ${mode==='AAL5'?`⌈${P}/48⌉`:`⌈(${P}+8)/44⌉`} = <code>${cells}</code>.
         Total transmitted = ${cells} × 53 = ${cells*53} B.<br>
         Payload fraction = ${P}/${cells*53} = <code>${fmt(overhead*100,1)}% payload</code> (overhead ${fmt(100-overhead*100,1)}%).<br>
         <span class="kbd">AAL5's 10% overhead beat AAL3/4's ~20% — and one CRC-32 over the whole message beats several short CRC-10s.</span>`
  };
}

/* --- 13. VCI table lookup (Ch5) --- */
function drillVCI(){
  // fixed network: A-S1-S2-S4-S5-F   (neighbours identified by name)
  const path=['A','S1','S2','S4','S5','F'];
  const vci=[]; for(let i=0;i<path.length-1;i++) vci.push(R(1,9));
  // build table for S2 and S4
  const tables={};
  for(let i=1;i<path.length-1;i++){
    const sw=path[i], prev=path[i-1], next=path[i+1];
    tables[sw]={inV: vci[i-1], inPort: prev, outV: vci[i], outPort: next};
  }
  const ask=pick(['S2','S4']);
  const t=tables[ask];
  const ansPort=t.outPort, ansV=t.outV;
  const options=shuffle([...new Set([t.outPort,'S1','S2','S3','S4','S5'].filter(x=>x!==ask))]).slice(0,4).map(o=>({key:o,text:o}));
  if(!options.find(o=>o.key===ansPort)){ options[0]={key:ansPort,text:ansPort}; }
  return { kind:'mc', title:'Virtual-circuit table',
    q:`A connection runs <code>A → S1 → S2 → S4 → S5 → F</code>.
       On each link it has been assigned a VCI. At <b>${ask}</b>, a packet arrives from <b>${t.inPort}</b>
       carrying <b>VCI = ${t.inV}</b>. Which neighbour does ${ask} send it to next?`,
    options, ans:options.findIndex(o=>o.key===ansPort),
    sol:`${ask}'s connection-table row is:
         <code>⟨VCI_in=${t.inV}, port_in=${t.inPort}⟩ → ⟨VCI_out=${t.outV}, port_out=${t.outPort}⟩</code>.<br>
         So it forwards to <b>${t.outPort}</b> and <b>rewrites the VCI to ${t.outV}</b>.<br>
         <span class="kbd">VCIs are only guaranteed unique per link, and every switch rewrites them — that's what makes
         datagram (destination-addressed) forwarding different from VC forwarding.</span>`
  };
}

{id:'wl', ch:'Ch 2', title:'Trace a learning switch',

  `<b>Setup.</b> Switches start with <b>empty</b> tables. They learn by watching the <b>source</b> address of every packet.`,
  `<b>Step 1 (A→B).</b> Switch of A receives it and records <code>A → (port A came in on)</code>.
   It doesn't know B, so it <b>floods</b>: sends the packet out every other port.`,
  `<b>Step 2.</b> Every switch the flooded packet reaches also records <code>A → (port it arrived from)</code>.
   That is the key insight: <i>the source is learned even by switches that only see the flood</i>.`,
  `<b>Step 3 (B replies).</b> Now the switches along B's path learn <code>B → port</code>.`,
  `<b>Step 4.</b> Once both endpoints have sent, later packets are <b>forwarded</b>, not flooded.`,
  `<b>What "sees the packet" means.</b> Picture the flood spreading out from the source switch like ripples,
   stopping where a switch already knows the destination (it forwards precisely instead of flooding on).`,
  `<b>Security angle.</b> Flooding is how unknown destinations get delivered, but it also exposes traffic.
   A <b>MAC-flooding</b> attack fills the tables with fake addresses so everything floods again — <b>port security</b> blocks it.`
 ]},
{id:'wb', ch:'Ch 2', title:'Exponential backoff, step by step',
 steps:[
  `<b>Setup.</b> Several stations all have data and all start transmitting at <b>t=0</b>. Wired Ethernet is
   <b>1-persistent</b>, so they all transmit the moment the line goes quiet → a guaranteed collision.`,
  `<b>Detect.</b> A collision takes a moment to be noticed; model it as "one slot later".`,
  `<b>Choose k.</b> After attempt number N, pick a random integer <code>k</code> with <code>0 ≤ k &lt; 2ᴺ</code>,
   then wait <code>k</code> slot times. (First attempt after a collision: N=1, so k is 0 or 1.)`,
  `<b>Resume.</b> Each station retries at its chosen time. Stations that pick k=0 retry immediately — and may collide again.`,
  `<b>Repeat.</b> Every collision doubles the range, so the chance two stations pick the same k keeps halving.`,
  `<b>Cap.</b> For N=11…15 the range stays at 1024; at N=16 the station <b>gives up and drops the packet</b>.`,
  `<b>Why fair-ish, not fair.</b> A station that has failed more times picks from a wider range (worse odds).
   That produces the <b>capture effect</b>, where one busy station can keep winning backoffs.`,
  `<b>Unslotted vs slotted.</b> Original ALOHA (no listening) peaks at <code>S = 1/(2e) ≈ 18%</code>; classic Ethernet
   (with carrier sense) reaches roughly <code>P/(2e−1+P)</code> of the line — ~64% for 512-byte packets.`
 ]},
{id:'ws', ch:'Ch 3', title:'Prune a spanning tree',
 steps:[
  `<b>Goal.</b> Loops in an Ethernet would circulate broadcast packets forever, but redundant links are valuable backup.
   Spanning Tree keeps a loop-free <b>tree</b> of links and disables the rest.`,
  `<b>Step 1 — elect a root.</b> The switch with the <b>smallest ID</b> (often its smallest MAC address) becomes the root.
   Root = <i>root of the tree</i>.`,
  `<b>Step 2 — everyone finds its path to the root.</b> Switches send <b>BPDUs</b> ("Hello") carrying their ID,
   who they think the root is, and their cost to it. Cost is usually hop count, later scaled by bandwidth.`,
  `<b>Step 3 — tie-breakers.</b> If two paths to the root have equal cost, use the one through the neighbour with the
   smaller ID. If two ports reach that same neighbour, use the smaller port number.`,
  `<b>Step 4 — enable ports.</b> Keep (a) the port toward your root path, (b) ports other switches use to reach the root,
   (c) for any shared segment, only the closest-to-root switch's port, and (d) ports to plain hosts.`,
  `<b>Result.</b> Redundant links are off (idle), even if they'd be shorter. All traffic flows toward/through the root.`,
  `<b>Cost.</b> Traditional 802.1D takes ~30 s to converge after boot. And a rogue switch can claim ID 0 to become root —
   Cisco's <b>Root Guard</b> prevents that.`
 ]},
{id:'wp', ch:'Ch 1', title:'Longest-prefix match',
 steps:[
  `<b>Setup.</b> An IP router's table lists <i>network prefixes</i>, like <code>10.0.0.0/8</code> and <code>10.1.2.0/24</code>.`,
  `<b>Match.</b> Find every prefix whose network bits equal the destination's leading bits.`,
  `<b>Longest wins.</b> Of the matches, take the one with the <b>most bits</b> (most specific).`,
  `<b>Default.</b> The <code>0.0.0.0/0</code> entry matches everything but is only used if nothing else matches.`,
  `<b>Why.</b> Prefixes are why routers need ~800 000 entries instead of one per host. In hardware this is done with
   <b>TCAM</b>, where shorter prefixes must be listed before longer ones so ties resolve to the longest match.`
 ]},
{id:'wf2', ch:'Ch 4', title:'Why Wi-Fi is not Ethernet',
 steps:[
  `<b>Wired Ethernet (CSMA/CD):</b> listen, talk, and <i>listen while talking</i> to catch collisions. Easy, because
   your own signal is ~100× stronger than a neighbour's.`,
  `<b>Radio:</b> a distant sender's signal can be ~10⁻⁶ of yours (−60 dB) — completely drowned out while you transmit.
   So <b>you cannot detect collisions</b>.`,
  `<b>Fix 1 — ACKs.</b> After each unicast frame the receiver, one <b>SIFS</b> (10 µs) later, sends a short ACK.
   No ACK → assume a collision and retransmit. ACKs carry no sequence number; they acknowledge the packet just heard.`,
  `<b>Fix 2 — CSMA/CA.</b> Instead of detecting collisions, <i>avoid</i> them. Even the first transmission waits a random
   number of slots (initially <code>k&lt;32</code>), doubling on each failure up to 1024.`,
  `<b>Timings.</b> slot 20 µs; DIFS (normal spacing) 50 µs; SIFS (short spacing, used for ACKs and RTS/CTS) 10 µs.
   Longer waits for data, shorter for ACKs, keeps ACKs from colliding.`,
  `<b>Hidden nodes.</b> Two stations that can't hear each other can still collide at a third. <b>RTS/CTS</b> fixes it:
   the receiver's CTS tells everyone nearby (including the hidden station) how long to stay quiet.`,
  `<b>Rate scaling.</b> When errors rise, drop the bit rate (54 → 48 → … → 6 Mbps) to reduce noise errors.
   Every frame's preamble and every ACK is sent at the minimum rate so everyone can hear it.`
 ]},
{id:'wv', ch:'Ch 5', title:'Virtual-circuit tables',
 steps:[
  `<b>Idea.</b> Instead of a destination address, a virtual circuit uses a small <b>connection ID (VCI)</b> that is
   only meaningful on each individual link.`,
  `<b>Setup first.</b> A connection must be established before any data flows: a path is chosen and each link gets a VCI.`,
  `<b>Switch table.</b> Each switch stores rows of <code>⟨VCI_in, port_in⟩ → ⟨VCI_out, port_out⟩</code>.`,
  `<b>Forwarding.</b> A packet arrives on a port with some VCI; look up that pair, <b>rewrite</b> the VCI to the outgoing value,
   and send it on the outgoing port.`,
  `<b>Compare with datagram forwarding.</b> Datagram routers look up the <i>destination</i> and never rewrite addresses
   (only TTL). VC switches look up <i>connection + arrival port</i> and always rewrite the VCI.`,
  `<b>Why VCIs are local.</b> Because they're rewritten at every hop, they only need to be unique per link — a tiny,
   compact namespace (good for fast lookup and small headers).`,
  `<b>Trade-off.</b> VCs can <i>guarantee</i> quality (reserved bandwidth, small delay) but routers hold per-connection state,
   failures are messier, and per-connection billing is hard. IP chose the stateless road; MPLS and RSVP are partial returns.`
 ]},
{id:'wa', ch:'Ch 5', title:'ATM: AAL5 vs AAL3/4',
 steps:[
  `<b>Why small cells?</b> Voice accumulates only 8 bytes/ms. Big packets mean big "fill time" delays and a big packet
   blocks the line for a long time. ATM chose fixed <b>53-byte cells = 48 data + 5 header</b>.`,
  `<b>Chopping up an IP packet</b> is called segmentation (at entry) and reassembly (at exit). It's done by an
   <b>ATM Adaptation Layer</b> (AAL).`,
  `<b>AAL3/4:</b> wrap the packet (add 8 bytes of CS-PDU wrapper), then chop into <b>44-byte</b> chunks. Each cell adds
   4 bytes of AAL3/4 header/trailer (type, sequence number, MID, CRC-10) on top of the 5-byte ATM header.`,
  `<b>AAL3/4 overhead:</b> 9 bytes of header for 44 bytes of data = <b>&gt;20%</b>. The IP-over-ATM folks hated that.`,
  `<b>AAL5:</b> chop straight into <b>48-byte</b> chunks; put a single <b>CRC-32</b> on the whole CS-PDU; drop the
   useless MID. Overhead = 5 bytes for 48 = <b>10%</b>.`,
  `<b>Surprise:</b> AAL5 is <i>more</i> reliable despite fewer checksum bits, because errors are rare and usually hit one cell.
   A single CRC-10 catches a one-cell error with only 1−2⁻¹⁰ certainty; CRC-32 gives 1−2⁻³². AAL3/4 only wins with errors in 4+ cells.`,
  `<b>Moral:</b> one checksum over the whole message beats many short ones over parts.`,
  `<b>Catch:</b> AAL5 detects lost cells only via the final CRC, and reassembly needs ATM's "no cell reordering" guarantee.`
 ]},
{id:'ww', ch:'Ch 4', title:'WPA2 four-way handshake',
 steps:[
  `<b>Goal.</b> The station must prove it knows the password, the access point must prove <i>it</i> is genuine,
   and the two must derive a fresh per-session key.`,
  `<b>Ingredients.</b> Both sides share a master key: the <b>PSK</b> (WPA2-Personal) or a negotiated <b>PMK</b>
   (WPA2-Enterprise). Each side also picks a random <b>nonce</b> (AP's = ANonce, station's = SNonce).`,
  `<b>Message 1 (AP → station):</b> AP sends its <b>ANonce</b>, in the clear, plus a replay counter.`,
  `<b>Station computes the session key.</b> <code>PTK = hash(master key, ANonce, SNonce, both MAC addresses)</code>.`,
  `<b>Message 2 (station → AP):</b> station sends its <b>SNonce</b> plus a signature (<b>MIC</b>, a.k.a. Michael).
   The AP can now compute the same PTK and verify the MIC — proving the station knew the master key.`,
  `<b>Message 3 (AP → station):</b> AP sends its own signed message (incremented replay counter), optionally including
   the <b>GTK</b> for broadcast traffic. Verifying it proves the AP to the station.`,
  `<b>Message 4 (station → AP):</b> a simple acknowledgment.`,
  `<b>Weakness.</b> Because the handshake is public, an eavesdropper can record it and <b>brute-force the password offline</b>.
   <b>KRACK</b> replayed message 3 to force key reinstallation (reusing the keystream) — fixed by ignoring replays.
   <b>WPA3</b> replaces the handshake with <b>SAE</b>, which defeats offline guessing and adds forward secrecy.`
 ]},
{id:'wvn', ch:'Ch 5', title:'Walk a VPN packet',
 steps:[
  `<b>Goal.</b> Reach an internal corporate address from home without a leased line.`,
  `<b>Step 1.</b> Your machine opens an ordinary TCP or UDP connection (or IPsec) to the workplace <b>VPN server</b>, over the public Internet.`,
  `<b>Step 2.</b> A software <b>virtual interface</b> (e.g. <code>tun0</code>) is created and given an <i>internal</i> workplace IP address.`,

  `<b>Step 4 — tunneling.</b> A packet handed to <code>tun0</code> is <b>encapsulated</b> in an outer packet and sent over the

  `<b>Step 5 — reply.</b> Return traffic is encapsulated back to you the same way.`,
  `<b>Practical bit.</b> Keep a <b>host-specific route</b> for the VPN server's own address so tunnel packets go via

function showProblem(spec, keep){
  cur={spec, data:spec.fn()};
  renderProblem();
}
function renderProblem(){
  const d=cur.data, spec=cur.spec, host=$('#prob');
  let body='';
  if(d.kind==='num'){
    body=`<div class="row"><input id="in" type="number" step="any" placeholder="${d.unit||''}">
          <button class="act" id="check">Check</button></div>`;
  } else if(d.kind==='mc'){
    body=d.options.map((o,i)=>`<button class="opt" data-i="${i}">${o.text}</button>`).join('');
  } else if(d.kind==='multi'){
    body=d.options.map((o,i)=>`<label class="opt" style="cursor:pointer"><input type="checkbox" data-i="${i}">${o.text}</label>`).join('')
        +`<button class="act" id="check">Check</button>`;
  } else {
    body=`<button class="act" id="check">Show answer</button>`;
  }
  host.innerHTML=`
  <div class="card">
    <span class="ch">${spec.ch}</span>
    <h2>${d.title}</h2>
    <div>${d.q}</div>
    <div id="ansarea" style="margin-top:12px">${body}</div>
    <div id="solbox"></div>
    <div style="margin-top:10px">
      <button class="act ghost" id="newp">New problem</button>
    </div>
  </div>`;
  $('#newp').onclick=()=>showProblem(spec);
  const check=$('#check');
  if(d.kind==='num'){
    check.onclick=()=>{
      const v=parseFloat($('#in').value);
      if(isNaN(v)){ $('#in').focus(); return; }
      const tol=d.tol??Math.max(0.05,Math.abs(d.ans)*0.02);
      const ok=Math.abs(v-d.ans)<=tol;
      finish(ok,`Your answer: <b>${v}</b>${d.unit?' '+d.unit:''} — correct is <b>${fmt(d.ans,3)}${d.unit?' '+d.unit:''}</b>.`);
    };
  } else if(d.kind==='mc'){
    host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      host.querySelectorAll('.opt').forEach(x=>{x.classList.remove('ok','no');x.disabled=true;});
      host.querySelector('.opt[data-i="'+d.ans+'"]').classList.add('ok');
      if(i!==d.ans) b.classList.add('no');
      finish(i===d.ans);
    });
  } else if(d.kind==='multi'){
    check.onclick=()=>{
      const chosen=[]; host.querySelectorAll('input[type=checkbox]').forEach(c=>{if(c.checked)chosen.push(+c.dataset.i);});
      const good=[...d.ans].sort().join(',')===chosen.sort().join(',');
      host.querySelectorAll('input[type=checkbox]').forEach(c=>{
        const i=+c.dataset.i, want=d.ans.includes(i);
        c.parentElement.classList.toggle('ok',want);
        c.parentElement.classList.toggle('no',c.checked&&!want);
        c.disabled=true;
      });
      check.disabled=true;
      finish(good);
    };
  } else {
    check.onclick=()=>{ check.disabled=true; finish(null); };
  }
}
function finish(ok, note){
  const d=cur.data;
  const box=$('#solbox');
  const flag = ok===null ? '' : `<span class="flag ${ok?'g':'b'}">${ok?'✓ correct':'✗ not quite'}</span> `;
  box.innerHTML=`<div class="sol ${ok===null?'':ok?'good':'wrong'}">${flag}${note||''}${ok===false?'<br>':''}${d.sol}</div>`;
  // stats (never let a blocked file:// localStorage break the app)
  try{
    const s=JSON.parse(localStorage.getItem('nst')||'{}');
    s[cur.spec.id]=s[cur.spec.id]||{a:0,c:0};
    if(ok!==null){ s[cur.spec.id].a++; if(ok) s[cur.spec.id].c++; }
    localStorage.setItem('nst',JSON.stringify(s));
  }catch(e){ /* ignore */ }
}

  EXAMPLES.forEach(updateCount);
  box.onclick=e=>{
    const nx=e.target.dataset.next, rs=e.target.dataset.reset;
    if(nx){ const ex=EXAMPLES.find(x=>x.id===nx); const target=$('#s-'+nx);
      const shown=target.children.length;
      if(shown<ex.steps.length){ const p=document.createElement('p'); p.innerHTML=ex.steps[shown]; target.appendChild(p); }
      updateCount(ex);
    }
    if(rs){ $('#s-'+rs).innerHTML=''; updateCount(EXAMPLES.find(x=>x.id===rs)); }
  };
}
function updateCount(ex){
  const n=$('#s-'+ex.id).children.length;
  document.querySelector(`[data-count="${ex.id}"]`).textContent=`${n}/${ex.steps.length} steps`;
}

/* ---------- Flashcards ---------- */
let deck=null, di=0, flipped=false, filter='All';
function cardChapters(){ return ['All',...new Set(CARDS.map(c=>c[0]))]; }
function buildDeck(){
  deck = shuffle(CARDS.filter(c=>filter==='All'||c[0]===filter));
  di=0; flipped=false;
}
function renderCards(){
  if(!deck) buildDeck();
  const c=deck[di];
  main.innerHTML=`
  <div class="card">
    <h2>Flashcards</h2>
    <div class="row">
      <span class="pill">Filter:</span>
      ${cardChapters().map(ch=>`<button class="act ghost" data-f="${ch}" style="padding:5px 12px;font-size:13px;${ch===filter?'border-color:#5b8def;color:#e8eefc':''}">${ch}</button>`).join('')}
      <button class="act" data-shuffle="1" style="padding:5px 12px;font-size:13px">Shuffle</button>
    </div>
    <p class="pill" style="margin-top:8px">Card ${di+1} / ${deck.length} · click the card to flip</p>
    <div class="fc" id="fc">${ flipped ? `<div class="a"><small class="pill">${c[0]}</small><br><b>${c[2]}</b></div>` : `<div><small class="pill">${c[0]}</small><br><b>${c[1]}</b></div>` }</div>
    <div class="row">
      <button class="act" data-mv="-1">◂ Prev</button>
      <button class="act" data-mv="1">Next ▸</button>
      <button class="act ghost" data-mv="r">Shuffle</button>
    </div>
  </div>`;
  $('#fc').onclick=()=>{ flipped=!flipped; renderCards(); };
  main.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; buildDeck(); renderCards(); });
  main.querySelectorAll('[data-shuffle]').forEach(b=>b.onclick=()=>{ deck=shuffle(deck); di=0; flipped=false; renderCards(); });
  main.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    const m=b.dataset.mv;
    if(m==='r'){ deck=shuffle(deck); di=0; } else { di=(di+ +m+deck.length)%deck.length; }
    flipped=false; renderCards();
  });
}

/* ---------- Cheat sheet ---------- */
function renderCheat(){ main.innerHTML=`<div class="card"><h2>Cheat sheet</h2>${CHEAT}</div>`; }

renderNav(); render();
</script>
